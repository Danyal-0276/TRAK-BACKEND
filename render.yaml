# Optional Render Blueprint (env vars are set in the Render dashboard).
# Live service: https://trak-backend-upip.onrender.com
services:
  - type: web
    name: TRAK-BACKEND
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT TRAK_Backend.asgi:application
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: trak-backend-upip.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://trak-fyp.netlify.app,https://localhost:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://trak-backend-upip.onrender.com
      - key: MONGODB_DJANGO_DATABASE
        value: trak_django
      - key: MONGODB_RAW_DATABASE
        value: TRAK_DB
      - key: SUMMARIZER_MODEL_ID
        value: daniB2112/bart-large-cnn-news-summarizer
      - key: SUMMARIZER_ENABLED
        value: "false"
      - key: PASSWORD_RESET_FRONTEND_URL
        value: https://trak-fyp.netlify.app/reset-password
      - key: SOCIAL_AUTH_FRONTEND_URL
        value: https://trak-fyp.netlify.app/login
      # Set in dashboard (secrets): DJANGO_SECRET_KEY, MONGODB_URI, FIREBASE_CREDENTIALS_JSON
