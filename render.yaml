# Optional Render Blueprint (env vars are set in the Render dashboard).
# Live service: https://trak-backend-upip.onrender.com
services:
  - type: web
    name: TRAK-BACKEND
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT TRAK_Backend.asgi:application
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: trak-backend-upip.onrender.com,.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://trak-flax.vercel.app,https://trak-fyp.netlify.app,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - key: CSRF_TRUSTED_ORIGINS
        value: https://trak-backend-upip.onrender.com,https://trak-flax.vercel.app,https://trak-fyp.netlify.app
      - key: MONGODB_DJANGO_DATABASE
        value: trak_django
      - key: MONGODB_RAW_DATABASE
        value: TRAK_DB
      - key: SUMMARIZER_SPACE_ID
        value: daniB2112/bart-news-summarizer
      - key: SUMMARIZER_SPACE_API_NAME
        value: /summarize
      - key: FAKE_DETECTION_SPACE_ID
        value: abd8433/fake-news-detection
      - key: FAKE_DETECTION_SPACE_API_NAME
        value: /detect
      - key: SUMMARIZER_MODEL_ID
        value: daniB2112/bart-news-summarizer
      - key: TTS_API_BASE_URL
        value: https://abd8433-urdu-tts-api.hf.space
      - key: CURRENTS_API_BASE_URL
        value: https://api.currentsapi.services/v1
      - key: NEWSDATA_API_BASE_URL
        value: https://newsdata.io/api/1
      - key: GNEWS_API_BASE_URL
        value: https://gnews.io/api/v4
      - key: SUMMARIZER_ENABLED
        value: "true"
      - key: FACT_CHECKER_ENABLED
        value: "true"
      - key: FACT_CHECKER_PROVIDERS
        value: wikipedia,wikidata,openalex
      # Optional: FACT_CHECKER_PROVIDER=google + GOOGLE_FACT_CHECK_API_KEY secret
      - key: PASSWORD_RESET_FRONTEND_URL
        value: https://trak-flax.vercel.app/reset-password
      - key: SOCIAL_AUTH_FRONTEND_URL
        value: https://trak-flax.vercel.app/login
      - key: PIPELINE_WORKERS
        value: "3"
      # News API keys — set as Render **Secrets** (Environment → Add Secret):
      #   CURRENTS_API_KEY, NEWSDATA_API_KEY, GNEWS_API_KEY
      # Pakistan region (optional tuning):
      #   CURRENTS_API_COUNTRY=PK
      #   NEWSDATA_API_COUNTRY=pk
      #   GNEWS_API_COUNTRY=pk
      # RSS feeds need no keys (configured in sources_catalog.py).
      # Set in dashboard (secrets): DJANGO_SECRET_KEY, MONGODB_URI, FIREBASE_CREDENTIALS_JSON

  # Scheduled scrape + pipeline (set MONGODB_URI etc. from dashboard secrets).
  - type: cron
    name: TRAK-PIPELINE
    schedule: "0 */4 * * *"
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: >
      python manage.py run_news_cycle
      --sources dawn dunya rss generic_sites currents newsdata gnews
      --scrape-limit 35 --workers 3 --requeue-stale
    envVars:
      - fromService: { type: web, name: TRAK-BACKEND, envVarKey: MONGODB_URI }
      - key: PIPELINE_WORKERS
        value: "3"
      - key: PIPELINE_AUTO_ENABLED
        value: "false"
