# Optional: local MongoDB + Redis (do not use on VPS if you keep Atlas)
services:
  api:
    depends_on:
      - mongodb
      - redis
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379/0

  mongodb:
    image: mongo:6.0
    container_name: trak-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: trak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
