# TRAK Backend — Docker Compose (API only)
#
# MongoDB stays on Atlas (.env MONGODB_URI). Web = Vercel. Mobile = separate app.
# This container is only the Django API (same role as Render today).
#
# From this folder:
#   docker compose up -d --build
#   curl http://127.0.0.1:8000/api/accounts/health/
#
# Optional local MongoDB + Redis for offline dev:
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up -d --build

services:
  api:
    build: .
    image: trak-api:local
    container_name: trak-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount .env so Django reads it directly (avoids Compose $ interpolation on secrets)
      - ./.env:/app/.env:ro
      # Optional FCM: - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
