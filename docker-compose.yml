# TRAK API — single Compose file
#
# Local (build from Dockerfile, Atlas via .env):
#   docker compose up -d --build
#   curl http://127.0.0.1:8000/api/accounts/health/
#
# Local + MongoDB + Redis (offline dev):
#   docker compose --profile localdb up -d --build
#
# VPS (pull image from GHCR; .env on server only):
#   export API_IMAGE=ghcr.io/<owner>/trak-api:<git-sha>
#   docker compose up -d --no-build --force-recreate
#
# Daily scrape + pipeline (separate one-shot container — does not touch the API):
#   docker compose --profile pipeline run --rm pipeline
#   # or: ./deploy/run-pipeline.sh
#
# MongoDB on Atlas for normal dev/prod. Web = Vercel. Mobile = separate app.

services:
  api:
    build: .
    image: ${API_IMAGE:-trak-api:local}
    container_name: trak-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      # With --profile localdb, set in .env: MONGODB_URI=mongodb://mongodb:27017, REDIS_URL=redis://redis:6379/0, USE_REDIS=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/accounts/health/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 120s

  # One-shot scrape + AI pipeline (same image as api; never started by `docker compose up -d`).
  # Trigger manually or via cron — see deploy/docker-vps.md and deploy/run-pipeline.sh
  pipeline:
    profiles: [pipeline]
    build: .
    image: ${API_IMAGE:-trak-api:local}
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      PIPELINE_AUTO_ENABLED: "false"
      SCRAPE_SCHEDULE_ENABLED: "false"
    entrypoint: ["python", "manage.py"]
    # run_news_cycle: full scrape + pipeline (works on all deployed images; ignores SCRAPE_SCHEDULE_ENABLED).
    command:
      - run_news_cycle
      - --total-limit
      - "100"
      - --scrape-limit
      - "40"
      - --no-pipeline-all
      - --pipeline-limit
      - "100"
      - --requeue-stale
    restart: "no"

  mongodb:
    profiles: [localdb]
    image: mongo:6.0
    container_name: trak-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    profiles: [localdb]
    image: redis:7-alpine
    container_name: trak-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
