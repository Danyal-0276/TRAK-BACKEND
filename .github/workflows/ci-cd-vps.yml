# TRAK_Backend repo CI/CD — build API image, deploy to VPS.
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY, READ_GHCR_TOKEN
# Server: .env on VPS (never commit).

name: CI-CD VPS Deploy

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: ci-check-only-not-for-production
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost
          MONGODB_URI: mongodb://127.0.0.1:27017

  docker-api:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify-backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/trak-api:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/trak-api:${{ github.sha }}
          cache-from: |
            type=gha,scope=trak-api
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/trak-api:latest
          cache-to: type=gha,mode=max,scope=trak-api

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [docker-api]
    steps:
      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Deploy API to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GHCR_OWNER,IMAGE_TAG,GITHUB_ACTOR,READ_GHCR_TOKEN
          script_stop: true
          script: |
            set -e
            cd /opt/trak

            git pull origin main

            echo "$READ_GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            export API_IMAGE="ghcr.io/${GHCR_OWNER}/trak-api:${IMAGE_TAG}"
            docker pull "$API_IMAGE"

            docker compose up -d --no-build --force-recreate --remove-orphans

            docker image prune -f

            curl -fsS http://127.0.0.1:8000/api/accounts/health/ || (docker compose logs --tail=80 api && exit 1)
        env:
          GHCR_OWNER: ${{ steps.owner.outputs.value }}
          IMAGE_TAG: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          READ_GHCR_TOKEN: ${{ secrets.READ_GHCR_TOKEN }}
